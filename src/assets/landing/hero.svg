<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="A modern house at golden hour">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EDE4"/><stop offset="1" stop-color="#E7D6C7"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8EFE6"/><stop offset="1" stop-color="#D8C3B0"/>
    </linearGradient>
    <radialGradient id="h-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7E2C8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F7E2C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="460" rx="20" fill="url(#h-sky)"/>
  <circle cx="470" cy="120" r="130" fill="url(#h-sun)"/>

  <!-- ground -->
  <path d="M0 372h640v88H0z" fill="#D9C6B4"/>
  <path d="M0 372c120-16 200 6 330 2s200-18 310-6v14H0z" fill="#CBB49F"/>

  <!-- house: stacked slabs, glass, cantilever -->
  <rect x="150" y="188" width="330" height="98" rx="6" fill="#FBF6F1"/>
  <rect x="120" y="286" width="390" height="92" rx="6" fill="#F3E9E0"/>
  <rect x="196" y="120" width="250" height="72" rx="6" fill="#FFFDFB"/>

  <!-- glazing -->
  <rect x="212" y="134" width="100" height="46" rx="3" fill="url(#h-glass)"/>
  <rect x="322" y="134" width="110" height="46" rx="3" fill="url(#h-glass)"/>
  <rect x="170" y="204" width="140" height="66" rx="3" fill="url(#h-glass)"/>
  <rect x="322" y="204" width="140" height="66" rx="3" fill="url(#h-glass)"/>
  <rect x="140" y="300" width="150" height="62" rx="3" fill="url(#h-glass)"/>
  <rect x="304" y="300" width="120" height="62" rx="3" fill="url(#h-glass)"/>

  <!-- warm interior light -->
  <g fill="#E9B979" opacity="0.5">
    <rect x="176" y="240" width="128" height="28" rx="2"/>
    <rect x="146" y="332" width="138" height="28" rx="2"/>
  </g>

  <!-- entry -->
  <rect x="436" y="308" width="46" height="54" rx="3" fill="#7C5B44"/>
  <path d="M482 362h58v10h-58z" fill="#C4AC97"/>

  <!-- balcony rails -->
  <g stroke="#C9B2A0" stroke-width="3">
    <path d="M150 188h330M120 286h390"/>
  </g>

  <!-- planting -->
  <g fill="#6E7F62">
    <circle cx="104" cy="356" r="22"/><circle cx="132" cy="364" r="16"/>
    <circle cx="536" cy="352" r="26"/><circle cx="566" cy="362" r="18"/>
  </g>
  <g fill="#5C6B52">
    <rect x="98" y="352" width="6" height="20"/><rect x="532" y="348" width="7" height="24"/>
  </g>
</svg>
