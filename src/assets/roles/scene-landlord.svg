<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Apartment buildings at golden hour with a to-let sign">
  <defs>
    <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/><stop offset="0.55" stop-color="#EA580C"/><stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="l-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/><stop offset="1" stop-color="#3B1206"/>
    </linearGradient>
    <radialGradient id="l-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.85"/><stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="l-mask">
      <rect width="400" height="260" fill="url(#l-fade)"/>
    </mask>
  </defs>
  <!-- The artwork dissolves into transparency over its bottom third, so the
       card's own background shows through instead of the illustration ending
       on a hard band of a slightly different colour. Nothing here needs to know
       what that background is. -->
  <g mask="url(#l-mask)">

  <rect width="400" height="260" fill="url(#l-sky)"/>
  <circle cx="200" cy="150" r="90" fill="url(#l-sun)"/>

  <!-- Cluster: 200 wide, centred, nothing past x=40..360. -->
  <g fill="#9A3412" opacity="0.6">
    <rect x="72" y="120" width="34" height="80" rx="3"/><rect x="300" y="112" width="32" height="88" rx="3"/>
  </g>

  <rect x="108" y="140" width="62" height="60" rx="3" fill="#FDE68A"/>
  <rect x="176" y="96" width="66" height="104" rx="3" fill="#F59E0B"/>
  <rect x="248" y="150" width="56" height="50" rx="3" fill="#FDBA74"/>

  <g fill="#FFFFFF">
    <rect x="118" y="150" width="14" height="12" rx="1.5"/><rect x="140" y="150" width="14" height="12" rx="1.5"/>
    <rect x="118" y="170" width="14" height="12" rx="1.5"/><rect x="140" y="170" width="14" height="12" rx="1.5"/>
  </g>
  <g fill="#FFFBEB">
    <rect x="186" y="108" width="15" height="13" rx="1.5"/><rect x="212" y="108" width="15" height="13" rx="1.5"/>
    <rect x="186" y="130" width="15" height="13" rx="1.5"/><rect x="212" y="130" width="15" height="13" rx="1.5"/>
    <rect x="186" y="152" width="15" height="13" rx="1.5"/><rect x="212" y="152" width="15" height="13" rx="1.5"/>
  </g>
  <g fill="#FFF7ED">
    <rect x="258" y="160" width="14" height="12" rx="1.5"/><rect x="280" y="160" width="14" height="12" rx="1.5"/>
  </g>

  <rect x="132" y="182" width="14" height="18" rx="1.5" fill="#92400E"/>
  <rect x="200" y="176" width="18" height="24" rx="1.5" fill="#92400E"/>
  <rect x="268" y="182" width="14" height="18" rx="1.5" fill="#92400E"/>

  <!-- Sign, moved well inside the safe margin. -->
  <path d="M76 178v22" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
  <rect x="48" y="154" width="56" height="26" rx="3" fill="#FFFFFF"/>
  <path d="M60 164h32M60 172h20" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
