<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="A row of apartment buildings at golden hour">
  <defs>
    <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/>
      <stop offset="0.5" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="l-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#l-sky)"/>
  <circle cx="200" cy="150" r="54" fill="#FEF3C7" opacity="0.55"/>

  <!-- back row -->
  <g fill="#9A3412" opacity="0.65">
    <rect x="20" y="96" width="52" height="120" rx="3"/>
    <rect x="330" y="82" width="54" height="134" rx="3"/>
    <rect x="150" y="70" width="44" height="146" rx="3"/>
  </g>

  <!-- main buildings -->
  <rect x="76" y="120" width="76" height="96" rx="4" fill="#FDE68A"/>
  <rect x="164" y="88" width="82" height="128" rx="4" fill="#F59E0B"/>
  <rect x="258" y="134" width="70" height="82" rx="4" fill="#FDBA74"/>

  <!-- windows -->
  <g fill="#FFFFFF">
    <rect x="88" y="132" width="16" height="14" rx="2"/><rect x="112" y="132" width="16" height="14" rx="2"/>
    <rect x="88" y="156" width="16" height="14" rx="2"/><rect x="112" y="156" width="16" height="14" rx="2"/>
    <rect x="88" y="180" width="16" height="14" rx="2"/><rect x="112" y="180" width="16" height="14" rx="2"/>
  </g>
  <g fill="#FFFBEB">
    <rect x="176" y="100" width="18" height="15" rx="2"/><rect x="204" y="100" width="18" height="15" rx="2"/>
    <rect x="176" y="126" width="18" height="15" rx="2"/><rect x="204" y="126" width="18" height="15" rx="2"/>
    <rect x="176" y="152" width="18" height="15" rx="2"/><rect x="204" y="152" width="18" height="15" rx="2"/>
    <rect x="176" y="178" width="18" height="15" rx="2"/><rect x="204" y="178" width="18" height="15" rx="2"/>
  </g>
  <g fill="#FFF7ED">
    <rect x="270" y="148" width="16" height="13" rx="2"/><rect x="296" y="148" width="16" height="13" rx="2"/>
    <rect x="270" y="170" width="16" height="13" rx="2"/><rect x="296" y="170" width="16" height="13" rx="2"/>
  </g>

  <!-- doors -->
  <rect x="106" y="196" width="18" height="20" rx="2" fill="#92400E"/>
  <rect x="196" y="192" width="20" height="24" rx="2" fill="#92400E"/>
  <rect x="284" y="196" width="18" height="20" rx="2" fill="#92400E"/>

  <!-- to-let sign -->
  <g>
    <path d="M48 200v22" stroke="#7C2D12" stroke-width="4" stroke-linecap="round"/>
    <rect x="18" y="170" width="60" height="34" rx="4" fill="#FFFFFF"/>
    <path d="M30 182h36M30 192h22" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect y="216" width="400" height="44" fill="url(#l-ground)"/>
</svg>
