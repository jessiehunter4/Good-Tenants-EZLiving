<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="A lit house at dusk">
  <defs>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="t-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#t-sky)"/>

  <!-- moon and stars -->
  <circle cx="330" cy="52" r="20" fill="#FDE68A" opacity="0.9"/>
  <circle cx="322" cy="46" r="20" fill="url(#t-sky)" opacity="0.85"/>
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="60" cy="40" r="1.6"/><circle cx="110" cy="26" r="1.2"/>
    <circle cx="168" cy="52" r="1.5"/><circle cx="248" cy="34" r="1.2"/>
    <circle cx="286" cy="86" r="1.4"/><circle cx="88" cy="76" r="1.1"/>
  </g>

  <!-- distant hills -->
  <path d="M0 176c46-26 82-24 124 2s86 22 130-4 96-18 146 10v76H0z" fill="#1D4ED8" opacity="0.55"/>

  <!-- house -->
  <g>
    <path d="M112 128 200 74l88 54v10H112z" fill="#F8FAFC"/>
    <rect x="126" y="132" width="148" height="82" rx="4" fill="#E2E8F0"/>
    <rect x="186" y="168" width="30" height="46" rx="2" fill="#1E3A8A"/>
    <circle cx="210" cy="192" r="2.4" fill="#FDE68A"/>
    <g fill="#FDE68A">
      <rect x="142" y="150" width="30" height="24" rx="2"/>
      <rect x="230" y="150" width="30" height="24" rx="2"/>
    </g>
    <g stroke="#CBD5E1" stroke-width="1.6">
      <path d="M157 150v24M142 162h30M245 150v24M230 162h30"/>
    </g>
    <rect x="238" y="86" width="18" height="30" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- warm light spill -->
  <path d="M186 214l-26 24h96l-26-24z" fill="#FDE68A" opacity="0.35"/>

  <!-- ground + path -->
  <rect y="214" width="400" height="46" fill="url(#t-ground)"/>
  <path d="M188 214h24l16 46h-56z" fill="#334155" opacity="0.6"/>

  <!-- shrubs -->
  <g fill="#166534">
    <circle cx="118" cy="210" r="12"/><circle cx="132" cy="212" r="9"/>
    <circle cx="284" cy="211" r="11"/><circle cx="270" cy="213" r="8"/>
  </g>
</svg>
