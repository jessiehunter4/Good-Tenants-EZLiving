<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" width="96" height="72" role="img" aria-label="Two apartment buildings with a to-let sign">
  <!-- Landlord: property held, not property sought. -->
  <rect x="18" y="20" width="30" height="44" rx="3" fill="#FDE68A"/>
  <rect x="52" y="8" width="32" height="56" rx="3" fill="#F59E0B"/>

  <!-- windows, left block -->
  <g fill="#FFFFFF">
    <rect x="23" y="27" width="8" height="7" rx="1"/>
    <rect x="35" y="27" width="8" height="7" rx="1"/>
    <rect x="23" y="39" width="8" height="7" rx="1"/>
    <rect x="35" y="39" width="8" height="7" rx="1"/>
  </g>
  <rect x="29" y="52" width="8" height="12" rx="1" fill="#B45309"/>

  <!-- windows, right block -->
  <g fill="#FFFBEB">
    <rect x="57" y="16" width="9" height="7" rx="1"/>
    <rect x="70" y="16" width="9" height="7" rx="1"/>
    <rect x="57" y="28" width="9" height="7" rx="1"/>
    <rect x="70" y="28" width="9" height="7" rx="1"/>
    <rect x="57" y="40" width="9" height="7" rx="1"/>
    <rect x="70" y="40" width="9" height="7" rx="1"/>
  </g>
  <rect x="63" y="52" width="9" height="12" rx="1" fill="#B45309"/>

  <!-- to-let sign, standing on the ground line rather than off the edge -->
  <path d="M9 47v17" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
  <rect x="1" y="36" width="21" height="13" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
  <path d="M5 40.5h13M5 44.5h8" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M2 64h92" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round"/>
</svg>
