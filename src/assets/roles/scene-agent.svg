<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Rooftops with a location pin marking a home">
  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="0.55" stop-color="#10B981"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="a-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#a-sky)"/>

  <!-- soft sun -->
  <circle cx="86" cy="62" r="30" fill="#ECFDF5" opacity="0.5"/>

  <!-- rooftops -->
  <g fill="#047857" opacity="0.7">
    <path d="M0 200l50-38 50 38z"/>
    <path d="M300 204l50-40 50 40z"/>
  </g>
  <g fill="#065F46">
    <path d="M40 214l46-36 46 36z"/>
    <path d="M268 216l46-36 46 36z"/>
  </g>

  <!-- centre house, the one being represented -->
  <g>
    <path d="M138 150 200 106l62 44v6H138z" fill="#ECFDF5"/>
    <rect x="150" y="154" width="100" height="62" rx="4" fill="#D1FAE5"/>
    <rect x="188" y="180" width="24" height="36" rx="2" fill="#047857"/>
    <rect x="160" y="166" width="20" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="220" y="166" width="20" height="16" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- location pin above it -->
  <g>
    <path d="M200 30c-16 0-29 13-29 29 0 21 29 47 29 47s29-26 29-47c0-16-13-29-29-29z" fill="#FFFFFF"/>
    <path d="M200 36c-13 0-23 10-23 23 0 17 23 38 23 38s23-21 23-38c0-13-10-23-23-23z" fill="#059669"/>
    <path d="M188 62l12-10 12 10v14h-24z" fill="#ECFDF5"/>
    <rect x="196" y="66" width="8" height="10" rx="1" fill="#059669"/>
  </g>

  <!-- pin shadow -->
  <ellipse cx="200" cy="112" rx="14" ry="4" fill="#065F46" opacity="0.35"/>

  <rect y="216" width="400" height="44" fill="url(#a-ground)"/>

  <!-- path -->
  <path d="M190 216h20l14 44h-48z" fill="#064E3B" opacity="0.6"/>
</svg>
