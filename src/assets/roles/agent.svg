  <path d="M71 14 94 32H48z" fill="#34D399"/>
  <rect x="60" y="40" width="9" height="8" rx="1" fill="#FFFFFF"/>
  <rect x="74" y="40" width="9" height="8" rx="1" fill="#FFFFFF"/>

  <!-- badge -->
  <rect x="6" y="12" width="40" height="50" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <rect x="18" y="6" width="16" height="10" rx="2" fill="#059669"/>
  <circle cx="26" cy="32" r="8" fill="#A7F3D0"/>
  <path d="M14 50c0-6.6 5.4-10 12-10s12 3.4 12 10z" fill="#A7F3D0"/>
  <path d="M14 56h24" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round"/>

